services:
  archive-api:
    build: .
    image: weld-gap-check:1.0.0
    ports:
      - "8000:8000"
    environment:
      ARCHIVE_DB: /data/archive.db
    volumes:
      - archive-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  archive-data:
